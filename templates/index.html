<!DOCTYPE html>
<html>
<head>
    <title>Employee Performance Evaluation</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Enter Employee Performance Data</h2>
    <form method="POST" action="/evaluate">
        <div class="form-group">
            <label>Employee Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Attendance (%)</label>
            <input type="number" name="attendance" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Tasks Completed (%)</label>
            <input type="number" name="tasks" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Teamwork (1-10)</label>
            <input type="number" name="teamwork" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Deadlines Met (%)</label>
            <input type="number" name="deadlines" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Evaluate</button>
    </form>
    <a href="/history" class="btn btn-link mt-3">View Evaluation History</a>
</body>
</html>
